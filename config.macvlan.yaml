secret: 'admin' # 默认 API 密码；生产环境必须修改
log-level: info
bind-address: "*"
allow-lan: true
ipv6: true
profile:
  store-selected: true
  store-fake-ip: true
external-controller: :9090
external-ui: ui
external-ui-url: "https://github.com/MetaCubeX/metacubexd/archive/refs/heads/gh-pages.tar.gz"
geodata-loader: standard
geodata-mode: true
geo-auto-update: true
geo-update-interval: 24
geox-url:
  geoip: "https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/geoip.dat"
  geosite: "https://github.com/Loyalsoldier/v2ray-rules-dat/releases/latest/download/geosite.dat"
  mmdb: "https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/country.mmdb"
mode: rule
unified-delay: true
tcp-concurrent: true
client-fingerprint: random
mixed-port: 7890 # HTTP(S) 和 SOCKS5 代理混合端口
tun:
  enable: true
  stack: gVisor
  udp-timeout: 300
  auto-route: true
  auto-redirect: false
  auto-detect-interface: true
  inet6-address:
    - fdfe:dcba:9876::1/126
dns:
  enable: true
  ipv6: true
  listen: :53
  enhanced-mode: fake-ip #方便静态路由
  fake-ip-range: 198.18.0.1/15 #fake-ip池
  fake-ip-range6: 2001:2:0:6152:0:9::/96 #IPv6 fake-ip池
  respect-rules: true
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
    - "2400:3200::1"
    - "2402:4e00::"
  nameserver:
    - https://cloudflare-dns.com/dns-query
    - https://dns.google/dns-query
  proxy-server-nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
  direct-nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query

proxies:
  - name: upstream-anytls
    type: anytls
    server: example.com
    port: 14444
    password: admin # 默认示例密码；生产环境必须修改
    sni: speedtest.net # 与仓库 server.crt 的 SAN 一致
    skip-cert-verify: true # 仅为仓库自签名测试证书；替换受信任证书后设为 false 或删除
    udp: true

  - name: upstream-vless
    type: vless
    server: example.com
    port: 14443
    uuid: 00000000-0000-0000-0000-000000000000 # 示例 UUID；生产环境必须替换
    tls: true
    servername: speedtest.net # 与仓库 server.crt 的 SAN 一致
    skip-cert-verify: true # 仅为仓库自签名测试证书；替换受信任证书后设为 false 或删除
    udp: true

  - name: upstream-ss
    type: ss
    server: example.com
    port: 14445
    cipher: chacha20-ietf-poly1305
    password: admin # 默认示例密码；生产环境必须修改
    udp: true
proxy-groups:
  - name: 🐟 漏网之鱼
    type: url-test
    interval: 60
    # Outbound/branch probe: default to gstatic. If the upstream is domestic
    # or centrally hosted in China, switch to http://connect.rom.miui.com/generate_204.
    url: http://www.gstatic.com/generate_204
    proxies:
      - upstream-anytls
      - upstream-vless
      - upstream-ss

  - name: GLOBAL
    type: select
    proxies:
      - 🐟 漏网之鱼
      - DIRECT
rules:
  # Block QUIC / HTTP3 without blocking normal TCP/443 HTTPS.
  - AND,((NETWORK,UDP),(DST-PORT,443)),REJECT

  # Branch fake-ip must be handled before private/reserved rules.
  - IP-CIDR,198.18.0.0/15,GLOBAL,no-resolve
  - IP-CIDR6,2001:2:0:6152:0:9::/96,GLOBAL,no-resolve

  # LAN / private / reserved
  - DOMAIN-SUFFIX,local,DIRECT
  - DOMAIN-SUFFIX,arpa,DIRECT
  - IP-CIDR,127.0.0.0/8,DIRECT
  - IP-CIDR,172.16.0.0/12,DIRECT
  - IP-CIDR,192.168.0.0/16,DIRECT
  - IP-CIDR,10.0.0.0/8,DIRECT
  - IP-CIDR,100.64.0.0/10,DIRECT
  - IP-CIDR,169.254.0.0/16,DIRECT
  - IP-CIDR,224.0.0.0/4,DIRECT
  - IP-CIDR6,::1/128,DIRECT
  - IP-CIDR6,fc00::/7,DIRECT
  - IP-CIDR6,fe80::/10,DIRECT
  - IP-CIDR6,ff00::/8,DIRECT

  # CN
  - GEOSITE,cn,DIRECT
  - GEOIP,CN,DIRECT

  # Others
  - MATCH,GLOBAL
